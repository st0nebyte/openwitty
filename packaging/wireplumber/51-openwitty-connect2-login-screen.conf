# OpenWitty (unofficial) - optional example, NEVER installed automatically. For the LOGIN SCREEN's audio
# service only. Not yet validated on a real login screen (docs/dev/RELEASE_READINESS.md).
#
# Why: a graphical login screen (Plasma Login, SDDM, GDM) runs its own PipeWire/WirePlumber as its own user.
# Observed: after a logout/login the CONNECT 2 speaker was at -23.5 dB instead of the knob level. Strong but
# untraced explanation: that WirePlumber has no saved state and applies its default sink volume (0.064,
# about -24 dB; PipeWire rounds it up to -23.5 dB) to the CONNECT 2, whose hardware volume the kernel
# compatibility quirk makes settable. The change can be LOUDER or quieter than before.
#
# What this does: the login screen's WirePlumber does not create the CONNECT 2 at all ("device.disabled"),
# so it cannot set its level - and the login screen plays no sound through the CONNECT 2. No other device
# is affected (the pattern names the CONNECT 2's card only); your own session never reads this file.
#
# Where (the login screen user's $HOME/.config; find the user with
#   systemctl show display-manager -p Id   and   getent passwd <user>):
#   Plasma Login (user plasmalogin):  /var/lib/plasmalogin/.config/wireplumber/wireplumber.conf.d/
#   SDDM (user sddm):                 /var/lib/sddm/.config/wireplumber/wireplumber.conf.d/      (untested)
#   GDM (user gdm):                   /var/lib/gdm/.config/wireplumber/wireplumber.conf.d/       (untested)
# Create missing directories AS THAT USER (not as root), then copy the file; see docs/INSTALLATION.md.
# It takes effect the next time the login screen starts. Undo: delete the file (next login screen start).
# Never put it into your own ~/.config/wireplumber or into /etc/wireplumber or /usr/share/wireplumber:
# the CONNECT 2 would disappear from your own desktop too.
monitor.alsa.rules = [
  {
    matches = [
      {
        # alsa_card.usb-Lewitt_GmbH_CONNECT_2_<serial>-00 (also without a serial: ..._CONNECT_2-00)
        device.name = "~alsa_card.usb-Lewitt_GmbH_CONNECT_2[_-].*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

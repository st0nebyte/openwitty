# OpenWitty (unofficial) - example, NOT installed automatically. For the LOGIN SCREEN's audio service only.
#
# Why: a graphical login screen (Plasma Login, SDDM, GDM) runs its own PipeWire/WirePlumber as its own user.
# That WirePlumber has no saved state and applies its default sink volume (0.064, about -24 dB) to every
# sound card with a hardware volume. With the CONNECT 2 kernel compatibility quirk the desktop has such a
# hardware volume, so each time the login screen appears the CONNECT 2 speaker jumps to -23.5 dB - louder or
# quieter than where the volume knob was. With this file the login screen does not manage the CONNECT 2 at
# all (no sound from the CONNECT 2 on the login screen; your own session is unaffected).
#
# Install (administrator; the directory depends on the login screen's user):
#   Plasma Login:  /var/lib/plasmalogin/.config/wireplumber/wireplumber.conf.d/
#   SDDM:          /var/lib/sddm/.config/wireplumber/wireplumber.conf.d/      (untested)
#   GDM:           /var/lib/gdm/.config/wireplumber/wireplumber.conf.d/       (untested)
# owned by that user, e.g.:
#   sudo install -D -m 0644 -o plasmalogin -g plasmalogin 51-openwitty-connect2-login-screen.conf \
#        /var/lib/plasmalogin/.config/wireplumber/wireplumber.conf.d/51-openwitty-connect2-login-screen.conf
# Takes effect the next time the login screen starts. Remove the file to undo.
# Never put this into your own ~/.config/wireplumber or /etc/wireplumber: the CONNECT 2 would disappear from
# your desktop too.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Lewitt_GmbH_CONNECT_2.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

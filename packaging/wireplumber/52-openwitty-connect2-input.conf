# OpenWitty (unofficial): use OpenWitty's ALSA profile set for the LEWITT CONNECT 2 (your own session).
# Effect: the desktop's input mute and input volume of the CONNECT 2 become software mute/volume, which really
# silence apps; the device's UAC2 Feature Unit 5 is no longer written. Output (speaker volume, knob sync) unchanged.
# Needs packaging/alsa-card-profile/{profile-sets,paths}/openwitty-connect2*.conf in ~/.config/alsa-card-profile/mixer/.
# Install: ~/.config/wireplumber/wireplumber.conf.d/, then `systemctl --user restart wireplumber`.
# Undo: delete this file (and the two profile files), restart WirePlumber.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x29c2"
        device.product.id = "0x0004"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "openwitty-connect2.conf"
      }
    }
  }
]

# OpenWitty (unofficial): ALSA card profile set for the LEWITT CONNECT 2, selected only for that device by
# packaging/wireplumber/52-openwitty-connect2-input.conf. Same mappings as PipeWire's default.conf for this device
# (stereo playback, 4-channel capture), except that the capture path does not use the UAC2 Feature Unit 5 mute and
# volume ("Mic Capture Switch/Volume").
#
# Why (verified on hardware, docs/FEATURE_COMPLETION_ROADMAP.md, LB-1): the CONNECT 2 ignores FU 5 mute for its audio
# and re-reports "muted" by itself, so a desktop input mute did not silence the microphone, and the desktop's saved
# input volume (+72 dB) was sent to FU 5 at every login. With this profile PipeWire mutes and scales the input in
# software: the desktop mute silences every app, and nothing is sent to FU 5.
#
# Install: ~/.config/alsa-card-profile/mixer/profile-sets/  (see docs/INSTALLATION.md). Undo: delete it and the
# WirePlumber rule, then `systemctl --user restart wireplumber`.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
priority = 15
direction = output

[Mapping analog-surround-40]
device-strings = surround40:%f
channel-map = front-left,front-right,rear-left,rear-right
paths-input = openwitty-connect2-input
priority = 12
direction = input

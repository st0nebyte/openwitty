# OpenWitty (unofficial): capture path for the LEWITT CONNECT 2 (used only by profile-sets/openwitty-connect2.conf).
# The FU 5 "Mic" element is left alone (no hardware mute or volume), so PipeWire uses software mute and volume.
# Install: ~/.config/alsa-card-profile/mixer/paths/

[General]
priority = 87
description-key = analog-input-microphone

[Element Mic]
switch = ignore
volume = ignore

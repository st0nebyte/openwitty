# OpenWitty (unofficial): playback path for the LEWITT CONNECT 2 (used only by profile-sets/openwitty-connect2.conf).
# Behaves exactly like PipeWire's generic analog-output path for this device - its only output control is "PCM"
# (hardware volume and mute, as in analog-output.conf.common) - but the desktop shows the output as
# "CONNECT 2 Output" instead of "Analog Output".
# Install: ~/.config/alsa-card-profile/mixer/paths/

[General]
priority = 99
description = CONNECT 2 Output

[Element PCM]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

# OpenWitty: LEWITT CONNECT 2 (29c2:0004). The always-broken unit-5 mic volume (channels 3/4)
# makes every ALSA mixer read fail with ENXIO on kernel 7.3, so alsa-lib/WirePlumber cannot
# load the mixer and PipeWire gets no routes. ignore_ctl_error turns those read errors into 0.
options snd_usb_audio quirk_flags=29c2:0004:ignore_ctl_error
